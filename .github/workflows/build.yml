name: build-image
on:
  push:
    branches: [main]
  # Pick up base image fixes (security updates, Proton bumps) without a commit.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [debian, proton]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: BASE=ghcr.io/parkervcp/steamcmd:${{ matrix.flavor }}
          load: true
          tags: steamcmd-test:${{ matrix.flavor }}
      # Never publish an image that cannot start a server. Auto update off, so
      # this checks the entrypoint itself and needs no network.
      - name: Smoke test
        run: |
          out=$(docker run --rm -e AUTO_UPDATE=0 -e SRCDS_APPID=1007 -e STARTUP='echo HXS_SMOKE_{{SRCDS_APPID}}' steamcmd-test:${{ matrix.flavor }})
          echo "$out"
          echo "$out" | grep -q 'HXS_SMOKE_1007'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: BASE=ghcr.io/parkervcp/steamcmd:${{ matrix.flavor }}
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ matrix.flavor }}
